<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>SECURE TERMINAL</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#00ff55;
    font-family:"Courier New",monospace;
    overflow:hidden;
}

body{
    animation:flicker .12s infinite alternate;
}

@keyframes flicker{
    from{opacity:.985}
    to{opacity:1}
}

#terminal{
    width:100vw;
    height:100vh;
    padding:25px;
    background:
      radial-gradient(circle at center,rgba(0,255,80,.09),transparent 55%),
      #000;
    position:relative;
    overflow:hidden;
}

/* CRT scanlines */
#terminal:before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.025) 0px,
        rgba(255,255,255,.025) 1px,
        transparent 1px,
        transparent 4px
    );
    z-index:20;
}

/* Green glow */
#terminal:after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow:inset 0 0 100px rgba(0,255,70,.08);
}

.header{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #00ff55;
    padding-bottom:12px;
    margin-bottom:15px;
    font-size:14px;
}

.warning{
    color:#ff2222;
    animation:warning 0.7s infinite;
}

@keyframes warning{
    50%{opacity:.25}
}

#output{
    height:72vh;
    overflow:hidden;
    font-size:14px;
    line-height:1.55;
    text-shadow:0 0 6px #00ff55;
}

.line{
    white-space:pre-wrap;
}

.dim{color:#168b3c}
.yellow{
    color:#ffe600;
    text-shadow:0 0 7px #ffe600;
}
.red{
    color:#ff2222;
    text-shadow:0 0 8px red;
}
.white{color:#d8ffe3}

.progress-area{
    position:absolute;
    left:25px;
    right:25px;
    bottom:35px;
}

.progress-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
}

.progress{
    height:22px;
    border:1px solid #00ff55;
    padding:2px;
    box-shadow:0 0 12px rgba(0,255,80,.35);
}

.bar{
    width:0%;
    height:100%;
    background:#00ff55;
    box-shadow:0 0 12px #00ff55;
    transition:width .15s linear;
}

.status{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
}

.cursor{
    display:inline-block;
    width:9px;
    height:17px;
    background:#00ff55;
    vertical-align:middle;
    animation:cursor .7s infinite;
}

@keyframes cursor{
    50%{opacity:0}
}

.glitch{
    animation:glitch .18s infinite;
}

@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(2px,-1px)}
    50%{transform:translate(-2px,1px)}
    75%{transform:translate(1px,1px)}
    100%{transform:translate(0)}
}

#flash{
    position:fixed;
    inset:0;
    background:#00ff55;
    opacity:0;
    pointer-events:none;
    z-index:50;
}

.flash{
    animation:flash .35s;
}

@keyframes flash{
    0%{opacity:.35}
    100%{opacity:0}
}

#lock{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:40;
    background:#000;
}

#lock h1{
    font-size:clamp(30px,6vw,70px);
    margin:0 0 10px;
    color:#ff2222;
    text-shadow:0 0 12px red,0 0 30px red;
}

#count{
    font-size:clamp(60px,16vw,140px);
    color:#ffe600;
    text-shadow:0 0 14px #ffe600;
    letter-spacing:6px;
}

#final{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    z-index:30;
    background:rgba(0,0,0,.94);
}

#final h1{
    font-size:clamp(35px,7vw,90px);
    margin:0;
    color:#00ff55;
    text-shadow:
      0 0 10px #00ff55,
      0 0 30px #00ff55;
}

#final p{
    color:#ff2222;
    font-size:18px;
    letter-spacing:3px;
}

.small{
    color:#4cff85!important;
    font-size:13px!important;
    letter-spacing:1px!important;
}
</style>
</head>

<body>

<div id="terminal">

    <div class="header">
        <span>◉ SECURE TERMINAL // VX-9</span>
        <span class="warning">⚠ UNAUTHORIZED SESSION</span>
    </div>

    <div id="output"></div>

    <div class="progress-area">

        <div class="progress-title">
            <span id="operation">INITIALIZING...</span>
            <span id="percent">0%</span>
        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div class="status">
            <span>STATUS: <b id="status">CONNECTING</b></span>
            <span><span class="cursor"></span></span>
        </div>

    </div>

    <div id="lock">
        <h1 class="glitch">DEVICE LOCKED</h1>
        <div id="count">01:00</div>
        <p class="small">SESSION VERIFICATION IN PROGRESS</p>
    </div>

    <div id="final">
        <h1 class="glitch">ACCESS GRANTED</h1>
        <p style="color:#ffe600;font-size:clamp(22px,4vw,40px);letter-spacing:6px;margin:10px 0 18px;text-shadow:0 0 10px #ffe600">USER: NINAME</p>
        <p>SECURE SESSION ESTABLISHED</p>
        <p class="small">TERMINAL CONNECTION ACTIVE</p>
    </div>

</div>

<div id="flash"></div>

<script>

const output = document.getElementById("output");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const operation = document.getElementById("operation");
const statusEl = document.getElementById("status");
const finalEl = document.getElementById("final");
const flash = document.getElementById("flash");

const commands = [

"[BOOT] Initializing kernel...",
"[BOOT] Loading encrypted modules...",
"[NET ] Searching available network interfaces...",
"[NET ] Interface detected.",
"[NET ] Establishing secure tunnel...",
"[AUTH] Negotiating authentication layer...",
"[AUTH] Session handshake initiated...",
"[SCAN] Running system diagnostics...",
"[SCAN] Checking active services...",
"[SCAN] Service map generated.",
"[CORE] Loading virtual access module...",
"[CORE] Module integrity: VERIFIED",
"[SEC ] Testing security boundary...",
"[SEC ] Boundary response detected.",
"[SIM ] Running terminal simulation...",
"[SIM ] Generating secure session...",
"[DATA] Preparing encrypted channel...",
"[DATA] Channel integrity verified.",
"[SYS ] Synchronizing terminal...",
"[SYS ] Synchronization complete.",
"[AUTH] Final authorization sequence...",
"[AUTH] Authorization token generated.",
"[CORE] Executing final sequence...",
"[CORE] Sequence accepted.",
"[SYS ] Preparing session...",
"[SYS ] FINALIZING..."
];

let i=0;
let progress=0;

function addLine(text,type=""){

    const div=document.createElement("div");
    div.className="line "+type;
    div.textContent=text;

    output.appendChild(div);

    while(output.children.length>27){
        output.removeChild(output.firstChild);
    }
}

function run(){

    if(i < commands.length){

        let text=commands[i];

        let type="";

        if(text.includes("[SEC") || text.includes("[AUTH"))
            type="red";

        if(text.includes("[CORE]") || text.includes("[DATA]"))
            type="yellow";

        if(text.includes("VERIFIED") || text.includes("complete"))
            type="white";

        addLine("> "+text,type);

        i++;

        progress=Math.min(
            94,
            Math.floor((i/commands.length)*94)
        );

        updateProgress();

        setTimeout(run,350 + Math.random()*450);

    }else{

        finish();

    }
}

function updateProgress(){

    bar.style.width=progress+"%";
    percent.textContent=progress+"%";

    if(progress<25)
        operation.textContent="ESTABLISHING CONNECTION";

    else if(progress<50)
        operation.textContent="SCANNING SYSTEM";

    else if(progress<75)
        operation.textContent="VERIFYING SECURITY";

    else if(progress<95)
        operation.textContent="AUTHORIZING SESSION";
}

function finish(){

    operation.textContent="FINAL AUTHORIZATION";

    let p=94;

    const timer=setInterval(()=>{

        p++;

        bar.style.width=p+"%";
        percent.textContent=p+"%";

        if(p>=100){

            clearInterval(timer);

            statusEl.textContent="AUTHORIZED";

            addLine("");
            addLine(">>> FINAL AUTHORIZATION ACCEPTED <<<","red");
            addLine(">>> SECURE SESSION ESTABLISHED <<<","yellow");
            addLine("");

            flash.classList.add("flash");

            setTimeout(()=>{
                const lockEl=document.getElementById("lock");
                const countEl=document.getElementById("count");
                lockEl.style.display="flex";
                let left=60;
                const t=setInterval(()=>{
                    left--;
                    const m=String(Math.floor(left/60)).padStart(2,"0");
                    const s=String(left%60).padStart(2,"0");
                    countEl.textContent=m+":"+s;
                    if(left<=0){
                        clearInterval(t);
                        lockEl.style.display="none";
                        flash.classList.remove("flash");
                        void flash.offsetWidth;
                        flash.classList.add("flash");
                        finalEl.style.display="flex";
                    }
                },1000);
            },700);
        }

    },100);

}

run();

</script>

</body>
</html>
